<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your account</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9E</text></svg>" />
</head>
<body>
<div class="login-shell">
  <form class="card login-card" id="form">
    <h1>Create your account</h1>
    <p class="muted small" id="policy">Loading...</p>

    <div id="err" class="banner bad hidden"></div>
    <div id="ok" class="banner ok hidden"></div>

    <div id="fields">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required autofocus />

      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" />
      <p class="small muted" style="margin:6px 0 0">At least 10 characters.</p>

      <button class="btn-primary mt" type="submit" style="width:100%;padding:12px">Create account</button>
    </div>

    <p class="small mt" style="text-align:center">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);

fetch('/signup-policy')
  .then((r) => r.json())
  .then((p) => {
    if (!p.enabled) {
      $('policy').textContent = 'Sign-up is switched off. Ask your administrator to create an account for you.';
      $('fields').classList.add('hidden');
      return;
    }
    $('policy').textContent = p.domains.length
      ? `Use your ${p.domains.map((d) => '@' + d).join(' or ')} email address.`
      : 'Create an account to start dialing.';
    if (p.requireApproval) {
      $('policy').textContent += ' An administrator approves new accounts before the first sign-in.';
    }
  })
  .catch(() => {
    $('policy').textContent = 'Create an account to start dialing.';
  });

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').classList.add('hidden');
  const res = await fetch('/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: $('name').value,
      email: $('email').value,
      password: $('password').value,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    $('err').textContent = data.error || 'Could not create the account.';
    $('err').classList.remove('hidden');
    return;
  }
  if (data.pending) {
    $('fields').classList.add('hidden');
    $('ok').textContent = data.message;
    $('ok').classList.remove('hidden');
    return;
  }
  location.href = data.redirect || '/';
});
</script>
</body>
</html>
