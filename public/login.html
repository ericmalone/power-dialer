<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in - Power Dialer</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9E</text></svg>" />
</head>
<body>
<div class="login-shell">
  <form class="card login-card" id="form">
    <h1>Power Dialer</h1>
    <p class="muted small">Sign in to start your dialing session.</p>

    <div id="err" class="banner bad hidden"></div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button class="btn-primary mt" type="submit" style="width:100%;padding:12px">Sign in</button>

    <p class="small mt" style="text-align:center">
      <a href="/forgot">Forgot your password?</a>
      <span id="signupLink" class="hidden"> &middot; <a href="/signup">Create an account</a></span>
    </p>
  </form>
</div>

<script>
const form = document.getElementById('form');
const err = document.getElementById('err');

fetch('/signup-policy')
  .then((r) => r.json())
  .then((p) => {
    if (p.enabled) document.getElementById('signupLink').classList.remove('hidden');
  })
  .catch(() => {});
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.add('hidden');
  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    err.textContent = data.error || 'Sign in failed.';
    err.classList.remove('hidden');
    return;
  }
  location.href = data.redirect || '/';
});
</script>
</body>
</html>
